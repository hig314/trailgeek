{% extends "base.html" %}
{% block title %}Sign in · trailgeek{% endblock %}
{% block content %}
<div class="tg-page">
  <h1>Sign in</h1>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Sign in</button></form>
  <p class="tg-small"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
</div>
{% endblock %}
